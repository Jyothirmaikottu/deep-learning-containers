name: PR - vLLM ARC

on:
  push:
    branches: [arc-vllm-testing]

permissions:
  contents: read
  pull-requests: read

env:
  # Common
  CONTAINER_TYPE: "general"
  FRAMEWORK: "vllm"
  PYTHON_VERSION: "py312"
  CUDA_VERSION: "cu129"
  OS_VERSION: "ubuntu22.04"

  # vLLM - Using AWS DLC public ECR image
  VLLM_VERSION: 0.13.0
  VLLM_DLC_IMAGE: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

  # CI environment configuration
  FORCE_COLOR: "1"

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Run permission gate (from base)
        uses: ./.github/actions/pr-permission-gate

  check-changes:
    needs: [gatekeeper]
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-check-changes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      build-change: ${{ steps.changes.outputs.build-change }}
      test-change: ${{ steps.changes.outputs.test-change }}
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build-change:
              - "docker/vllm/**"
              - "scripts/vllm/**"
              - "scripts/common/**"
              - "scripts/telemetry/**"
              - ".github/workflows/pr-vllm-arc*"
            test-change:
              - "test/vllm/**"

  # ==============================================
  # =============== vLLM Tests ==================
  # ==============================================

  build-vllm-ec2-image:
    needs: [check-changes]
    if: needs.check-changes.outputs.build-change == 'true'
    runs-on: vllm-runner
    concurrency:
      group: ${{ github.workflow }}-build-vllm-ec2-image-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      ci-image: ${{ steps.build.outputs.image-tag }}
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5
  
      # - name: Build Docker image
      #   id: build
      #   env:
      #     IMAGE_TAG: vllm-image-test
      #   run: |
      #     # Build the Docker image
      #     docker build \
      #       -t ${IMAGE_TAG} \
      #       -f docker/${{ env.FRAMEWORK }}/Dockerfile \
      #       --build-arg BASE_IMAGE=vllm/vllm-openai:v${{ env.VLLM_VERSION }} \
      #       --build-arg FRAMEWORK_VERSION=${{ env.VLLM_VERSION }} \
      #       --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
      #       --build-arg CUDA_VERSION=${{ env.CUDA_VERSION }} \
      #       --build-arg OS_VERSION=${{ env.OS_VERSION }} \
      #      .
  
      #     # Verify the image was built
      #     docker images | grep ${IMAGE_TAG}
  
      #     # Set output for downstream jobs
      #     echo "image-tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Test with built image
        run: |
          nvidia-smi 
          docker info | grep -i runtime
          ctr run --rm --gpus 0 \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2
            


