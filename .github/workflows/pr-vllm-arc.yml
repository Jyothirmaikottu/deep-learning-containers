name: PR - vLLM ARC

on:
  push:
    branches: [arc-vllm-testing]

permissions:
  contents: read
  pull-requests: read

env:
  # Common
  CONTAINER_TYPE: "general"
  FRAMEWORK: "vllm"
  PYTHON_VERSION: "py312"
  CUDA_VERSION: "cu129"
  OS_VERSION: "ubuntu22.04"

  # vLLM EC2 - Using public ECR image
  VLLM_VERSION: 0.13.0
  PROD_EC2_IMAGE: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

  # vLLM SageMaker - Using public ECR image
  PROD_SAGEMAKER_IMAGE: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

  # vLLM RayServe - Using public ECR image
  VLLM_RAYSERVE_VERSION: 0.10.2
  PROD_RAYSERVE_IMAGE: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

  # CI environment configuration
  FORCE_COLOR: "1"

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Run permission gate (from base)
        uses: ./.github/actions/pr-permission-gate

  check-changes:
    needs: [gatekeeper]
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-check-changes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      build-change: ${{ steps.changes.outputs.build-change }}
      test-change: ${{ steps.changes.outputs.test-change }}
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build-change:
              - "docker/vllm/**"
              - "scripts/vllm/**"
              - "scripts/common/**"
              - "scripts/telemetry/**"
              - ".github/workflows/pr-vllm-arc*"
            test-change:
              - "test/vllm/**"

  # ==============================================
  # =============== vLLM EC2 jobs ================
  # ==============================================
  set-ec2-test-environment:
    needs: [check-changes]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.test-change == 'true')
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-set-ec2-test-environment-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      image-uri: ${{ steps.set-env.outputs.IMAGE_URI }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set test environment
        id: set-env
        run: |
          # Always use the public ECR image since we're not building
          IMAGE_URI=${{ env.PROD_EC2_IMAGE }}
          echo "Image URI to test: ${IMAGE_URI}"
          echo "IMAGE_URI=${IMAGE_URI}" >> ${GITHUB_OUTPUT}

  vllm-ec2-regression-test:
    needs: [set-ec2-test-environment]
    if: success()
    runs-on: arc-runner-set
    concurrency:
      group: ${{ github.workflow }}-vllm-ec2-regression-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Checkout vLLM tests
        uses: actions/checkout@v5
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm_source

      - name: Setup for vLLM tests
        run: |
          kubectl run vllm-setup-${{ github.run_id }}-${{ github.run_attempt }} \
            --image=${{ env.PROD_EC2_IMAGE }} \
            --rm -i --restart=Never \
            --overrides='{
              "spec": {
                "containers": [{
                  "name": "setup",
                  "image": "${{ env.PROD_EC2_IMAGE }}",
                  "resources": {"limits": {"nvidia.com/gpu": "1"}},
                  "command": ["/bin/bash", "-c", "scripts/vllm/vllm_0_13_0_test_setup.sh"],
                  "env": [{
                    "name": "HF_TOKEN", 
                    "value": "${{ secrets.HUGGING_FACE_HUB_TOKEN }}"
                  }],
                  "volumeMounts": [{
                    "name": "workspace",
                    "mountPath": "/workdir"
                  }],
                  "workingDir": "/workdir"
                }],
                "volumes": [{
                  "name": "workspace",
                  "emptyDir": {"sizeLimit": "10Gi"}
                }]
              }
            }'

      - name: Run vLLM regression tests
        run: |
          kubectl run vllm-regression-test-${{ github.run_id }}-${{ github.run_attempt }} \
            --image=${{ env.PROD_EC2_IMAGE }} \
            --rm -i --restart=Never \
            --overrides='{
              "spec": {
                "containers": [{
                  "name": "test",
                  "image": "${{ env.PROD_EC2_IMAGE }}",
                  "resources": {"limits": {"nvidia.com/gpu": "1"}},
                  "command": ["/bin/bash", "-c", "scripts/vllm/vllm_regression_test.sh"],
                  "env": [{
                    "name": "HF_TOKEN", 
                    "value": "${{ secrets.HUGGING_FACE_HUB_TOKEN }}"
                  }],
                  "volumeMounts": [{
                    "name": "workspace",
                    "mountPath": "/workdir"
                  }],
                  "workingDir": "/workdir"
                }],
                "volumes": [{
                  "name": "workspace",
                  "emptyDir": {"sizeLimit": "10Gi"}
                }]
              }
            }'
