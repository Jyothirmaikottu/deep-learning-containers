name: PR - vLLM ARC

on:
  push:
    branches: [arc-vllm-testing]

permissions:
  contents: read
  pull-requests: read

env:
  # Common
  CONTAINER_TYPE: "general"
  FRAMEWORK: "vllm"
  PYTHON_VERSION: "py312"
  CUDA_VERSION: "cu129"
  OS_VERSION: "ubuntu22.04"

  # vLLM - Using AWS DLC public ECR image
  VLLM_VERSION: 0.13.0
  VLLM_DLC_IMAGE: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

  # CI environment configuration
  FORCE_COLOR: "1"

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Run permission gate (from base)
        uses: ./.github/actions/pr-permission-gate

  check-changes:
    needs: [gatekeeper]
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-check-changes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      build-change: ${{ steps.changes.outputs.build-change }}
      test-change: ${{ steps.changes.outputs.test-change }}
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build-change:
              - "docker/vllm/**"
              - "scripts/vllm/**"
              - "scripts/common/**"
              - "scripts/telemetry/**"
              - ".github/workflows/pr-vllm-arc*"
            test-change:
              - "test/vllm/**"

  # ==============================================
  # =============== vLLM Tests ==================
  # ==============================================
  vllm-gpu-smoke-test:
    needs: [check-changes]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.test-change == 'true')
    runs-on: arc-runner-set
    concurrency:
      group: ${{ github.workflow }}-vllm-gpu-smoke-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 15
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Check runner environment
        run: |
            echo '=== GPU Check ==='
            nvidia-smi || echo 'nvidia-smi not available'
            docker run --rm --gpus all public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

      - name: Test DLC container
        run: |
          docker run --rm --gpus all public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
          bash -c "python3 -c "
          import vllm
          import torch
          print('vLLM imported successfully')
          print(f'vLLM version: {vllm.__version__}')
          print(f'CUDA available: {torch.cuda.is_available()}')
          if torch.cuda.is_available():
              print(f'GPU count: {torch.cuda.device_count()}')
              print(f'Current GPU: {torch.cuda.current_device()}')
              print(f'GPU name: {torch.cuda.get_device_name()}')
          else:
              print('No CUDA GPUs available')
          ""

  vllm-regression-test:
    needs: [vllm-gpu-smoke-test]
    if: success()
    runs-on: arc-runner-set
    concurrency:
      group: ${{ github.workflow }}-vllm-regression-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Checkout vLLM tests
        uses: actions/checkout@v5
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm_source

      - name: Run vLLM regression tests
        run: |
          docker run --rm --gpus=all \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e HF_TOKEN="${{ secrets.HUGGING_FACE_HUB_TOKEN }}" \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
            bash -c "
            chmod +x scripts/vllm/vllm_0_13_0_test_setup.sh
            scripts/vllm/vllm_0_13_0_test_setup.sh
            chmod +x scripts/vllm/vllm_regression_test.sh
            scripts/vllm/vllm_regression_test.sh
            "

  vllm-cuda-test:
    needs: [vllm-gpu-smoke-test]
    if: success()
    runs-on: arc-runner-set
    concurrency:
      group: ${{ github.workflow }}-vllm-cuda-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Checkout vLLM tests
        uses: actions/checkout@v5
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm_source

      - name: Run vLLM CUDA tests
        run: |
          docker run --rm --gpus=all \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e HF_TOKEN="${{ secrets.HUGGING_FACE_HUB_TOKEN }}" \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
            bash -c "
            chmod +x scripts/vllm/vllm_0_13_0_test_setup.sh
            scripts/vllm/vllm_0_13_0_test_setup.sh
            chmod +x scripts/vllm/vllm_cuda_test.sh
            scripts/vllm/vllm_cuda_test.sh
            "

  vllm-examples-test:
    needs: [vllm-gpu-smoke-test]
    if: success()
    runs-on: arc-runner-set
    concurrency:
      group: ${{ github.workflow }}-vllm-examples-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    timeout-minutes: 60
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Checkout vLLM tests
        uses: actions/checkout@v5
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm_source

      - name: Run vLLM examples tests
        run: |
          docker run --rm --gpus=all \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e HF_TOKEN="${{ secrets.HUGGING_FACE_HUB_TOKEN }}" \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
            bash -c "
            chmod +x scripts/vllm/vllm_0_13_0_test_setup.sh
            scripts/vllm/vllm_0_13_0_test_setup.sh
            chmod +x scripts/vllm/vllm_ec2_examples_test.sh
            scripts/vllm/vllm_ec2_examples_test.sh
            "
