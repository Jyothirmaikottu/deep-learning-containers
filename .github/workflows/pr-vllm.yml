
name: PR - vLLM EC2

on:
  push:
    branches: [arc-vllm-testing]

permissions:
  contents: read
  pull-requests: read

env:
  # Common
  CONTAINER_TYPE: "general"
  FRAMEWORK: "vllm"
  PYTHON_VERSION: "py312"
  CUDA_VERSION: "cu129"
  OS_VERSION: "ubuntu22.04"
  VLLM_VERSION: "0.13.0"
  
  # CI environment configuration
  FORCE_COLOR: "1"

jobs:
  gatekeeper:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-gate-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base branch (safe)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Run permission gate (from base)
        uses: ./.github/actions/pr-permission-gate

  check-changes:
    needs: [gatekeeper]
    if: success()
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-check-changes-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    outputs:
      build-change: ${{ steps.changes.outputs.build-change }}
      test-change: ${{ steps.changes.outputs.test-change }}
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Detect file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            build-change:
              - "docker/vllm/**"
              - "scripts/vllm/**"
              - "scripts/common/**"
              - "scripts/telemetry/**"
              - ".github/workflows/pr-vllm*"
            test-change:
              - "test/vllm/**"

  build-and-test-vllm-ec2:
    needs: [check-changes]
    if: |
      always() && !failure() && !cancelled() &&
      (needs.check-changes.outputs.build-change == 'true' || needs.check-changes.outputs.test-change == 'true')
    runs-on:
      - vllm-runner
    concurrency:
      group: ${{ github.workflow }}-build-test-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout DLC source
        uses: actions/checkout@v5

      - name: ECR login
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com

      - name: Build vLLM EC2 image
        run: |
          CI_IMAGE_URI=${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/ci:${{ env.FRAMEWORK }}-${{ env.VLLM_VERSION }}-gpu-${{ env.PYTHON_VERSION }}-${{ env.CUDA_VERSION }}-${{ env.OS_VERSION }}-ec2-pr-${{ github.event.pull_request.number }}
          echo "Building image: ${CI_IMAGE_URI}"
          
          docker buildx build --progress plain \
            --build-arg CACHE_REFRESH="$(date +"%Y-%m-%d")" \
            --build-arg BASE_IMAGE="vllm/vllm-openai:v${{ env.VLLM_VERSION }}" \
            --build-arg CONTAINER_TYPE="${{ env.CONTAINER_TYPE }}" \
            --build-arg FRAMEWORK="${{ env.FRAMEWORK }}" \
            --build-arg FRAMEWORK_VERSION="${{ env.VLLM_VERSION }}" \
            --cache-to=type=inline \
            --cache-from=type=registry,ref=${CI_IMAGE_URI} \
            --tag ${CI_IMAGE_URI} \
            --load \
            --target vllm-ec2 \
            -f docker/${{ env.FRAMEWORK }}/Dockerfile .
          
          echo "CI_IMAGE_URI=${CI_IMAGE_URI}" >> ${GITHUB_ENV}

      - name: Checkout vLLM tests
        uses: actions/checkout@v5
        with:
          repository: vllm-project/vllm
          ref: v${{ env.VLLM_VERSION }}
          path: vllm_source

      - name: Start container
        run: |
          CONTAINER_ID=$(docker run -d -it --rm --gpus=all --entrypoint /bin/bash \
            -v ${HOME}/.cache/huggingface:/root/.cache/huggingface \
            -v ${HOME}/.cache/vllm:/root/.cache/vllm \
            -v .:/workdir --workdir /workdir \
            -e HF_TOKEN=${{ secrets.HUGGING_FACE_HUB_TOKEN }} \
            ${CI_IMAGE_URI})
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV

      - name: Setup for vLLM tests
        run: |
          docker exec ${CONTAINER_ID} scripts/vllm/vllm_0_13_0_test_setup.sh

      - name: Run vLLM regression tests
        run: |
          docker exec ${CONTAINER_ID} scripts/vllm/vllm_regression_test.sh

      - name: Run vLLM CUDA tests
        if: success() || failure()
        run: |
          docker exec ${CONTAINER_ID} scripts/vllm/vllm_cuda_test.sh

      - name: Run vLLM example tests
        if: success() || failure()
        run: |
          docker exec ${CONTAINER_ID} scripts/vllm/vllm_ec2_examples_test.sh

      - name: Cleanup
        if: always()
        run: |
          if [ ! -z "${CONTAINER_ID}" ]; then
            docker stop ${CONTAINER_ID} || true
          fi

