name: Test - 2 Jobs with 4 GPUs Each

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-2-jobs-4gpus.yaml"

jobs:
  multi-gpu-validation:
    runs-on: gpu-1gpu-runner
    strategy:
      matrix:
        job_id: [0, 1]
      max-parallel: 2 
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Verify GPU availability
        run: |
          echo "=== Available GPUs on Node ==="
          nvidia-smi --query-gpu=index,name,memory.total --format=csv
          echo ""
          echo "=== Job ${{ matrix.job_id }} starting ==="
      
      - name: Pull vLLM image
        run: |
          docker pull public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2
      
      - name: Start vLLM container for job ${{ matrix.job_id }}
        run: |
          CONTAINER_ID=$(docker run -d --rm --gpus=all \
            -p $((8000 + ${{ matrix.job_id }})):8000 \
            -e VLLM_WORKER_MULTIPROC_METHOD=spawn \
            -e HF_TOKEN=${{ secrets.HUGGING_FACE_HUB_TOKEN }} \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
            --model facebook/opt-125m \
            --tensor-parallel-size 4 \
            --max-model-len 2048)
          
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV
          echo "Container ID: $CONTAINER_ID"
      
      - name: Wait for vLLM to start
        run: |
          echo "Waiting for vLLM server to start..."
          for i in {1..60}; do
            RESPONSE=$(docker exec ${CONTAINER_ID} curl -s -X POST http://localhost:8000/v1/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "facebook/opt-125m",
                "prompt": "Hello",
                "max_tokens": 5,
                "temperature": 0.0
              }' 2>&1 || echo "failed")
            
            if echo "$RESPONSE" | grep -q "choices"; then
              echo "vLLM server is ready!"
              echo "Test response: $RESPONSE"
              break
            fi
            echo "Attempt $i/60: Server not ready yet..."
            sleep 5
          done
          
          # Show startup logs
          echo "=== Container Startup Logs ==="
          docker logs ${CONTAINER_ID} --tail 30
      
      - name: Verify GPU allocation for job ${{ matrix.job_id }}
        run: |
          echo "=== Job ${{ matrix.job_id }} GPU Info ==="
          docker exec ${CONTAINER_ID} nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used --format=csv
          docker exec ${CONTAINER_ID} python -c "import torch; print(f'Torch sees {torch.cuda.device_count()} GPU(s)')"
      
      - name: Run inference test on job ${{ matrix.job_id }}
        run: |
          echo "=== Testing vLLM API ==="
          docker exec ${CONTAINER_ID} curl -f http://localhost:8000/v1/models
          
          echo ""
          echo "=== Running sample inference ==="
          docker exec ${CONTAINER_ID} curl -X POST http://localhost:8000/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "facebook/opt-125m",
              "prompt": "San Francisco is a",
              "max_tokens": 50,
              "temperature": 0.7
            }'
      
      - name: Show final GPU stats
        if: always()
        run: |
          echo "=== Final GPU Stats for Job ${{ matrix.job_id }} ==="
          docker exec ${CONTAINER_ID} nvidia-smi || true
      
      - name: Cleanup container
        if: always()
        run: |
          if [ ! -z "${CONTAINER_ID}" ]; then
            echo "Stopping container ${CONTAINER_ID}"
            docker stop ${CONTAINER_ID} || true
          fi
