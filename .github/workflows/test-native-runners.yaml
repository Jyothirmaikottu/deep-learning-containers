name: vLLM Native Runner Test

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-native-runners.yaml"

jobs:
  vllm-inference:
    runs-on: gpu-native-runner
    container:
      image: public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2
    
    steps:
      - name: Check GPU availability
        run: nvidia-smi
      
      - name: Start vLLM server
        run: |
          vllm serve facebook/opt-125m \
            --host 0.0.0.0 \
            --port 8000 &
          echo "Waiting for vLLM server to start..."
          sleep 30
      
      - name: Test inference
        run: |
          curl -X POST http://localhost:8000/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "facebook/opt-125m",
              "prompt": "AI is",
              "max_tokens": 50
            }'
      
      - name: Health check
        run: |
          curl http://localhost:8000/health
