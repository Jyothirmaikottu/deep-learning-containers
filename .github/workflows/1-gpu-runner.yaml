name: Test - 8 GPUs Parallel

on:
  workflow_dispatch:

jobs:
  multi-gpu-validation:
    runs-on: gpu-1gpu-runner
    strategy:
      matrix:
        gpu_id: [0, 1, 2, 3, 4, 5, 6, 7]
      max-parallel: 8
      fail-fast: false  
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Pull vLLM image
        run: |
          docker pull public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2

      - name: Start vLLM container on GPU ${{ matrix.gpu_id }}
        run: |
          CONTAINER_ID=$(docker run -d --rm --gpus=all \
            -v ${HOME}/.cache/huggingface:/root/.cache/huggingface \
            -e HF_TOKEN=${{ secrets.HUGGING_FACE_HUB_TOKEN }} \
            -v .:/workdir --workdir /workdir \
            -p $((8000 + ${{ matrix.gpu_id }})):8000 \
            public.ecr.aws/deep-learning-containers/vllm:0.13.0-gpu-py312-ec2 \
            vllm serve meta-llama/Llama-3.2-1B-Instruct \
            --host 0.0.0.0 \
            --port 8000)
          echo "CONTAINER_ID=$CONTAINER_ID" >> $GITHUB_ENV

      - name: Verify GPU allocation for job ${{ matrix.gpu_id }}
        run: |
          echo "=== Job ${{ matrix.gpu_id }} GPU Info ==="
          docker exec ${CONTAINER_ID} nvidia-smi --query-gpu=index,name,utilization.gpu,memory.used --format=csv
          docker exec ${CONTAINER_ID} python -c "import torch; print(f'Torch sees {torch.cuda.device_count()} GPU(s)')"

      - name: Run inference test on GPU ${{ matrix.gpu_id }}
        run: |
          # Wait for vLLM server
          docker exec ${CONTAINER_ID} bash -c "
            timeout 120 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do
              echo \"Waiting for vLLM server...\";
              sleep 2;
            done'
          "

          # Test health endpoint
          docker exec ${CONTAINER_ID} curl -f http://localhost:8000/health

          # List available models
          docker exec ${CONTAINER_ID} curl -f http://localhost:8000/v1/models

          # Run inference
          docker exec ${CONTAINER_ID} curl -f http://localhost:8000/v1/completions \
            -H "Content-Type: application/json" \
            -d '{
              "model": "meta-llama/Llama-3.2-1B-Instruct",
              "prompt": "GPU ${{ matrix.gpu_id }} test: Hello, world!",
              "max_tokens": 50
            }'

      - name: Keep container running for 2 minutes
        run: |
          echo "Keeping GPU ${{ matrix.gpu_id }} busy..."
          sleep 120

      - name: Show final GPU stats
        if: always()
        run: |
          echo "=== Final GPU Stats for Job ${{ matrix.gpu_id }} ==="
          docker exec ${CONTAINER_ID} nvidia-smi || true

      - name: Cleanup container
        if: always()
        run: |
          docker stop ${CONTAINER_ID} || true
