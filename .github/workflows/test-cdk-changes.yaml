name: Test - P4D 4 GPUs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-cdk-changes.yaml"

jobs:
  test-gpu-standard:
    runs-on: gpu-standard-runners
    steps:
      - name: Check GPUs
        run: nvidia-smi

      - name: Check Docker
        run: |
          docker info
          docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi

  test-p4d:
    runs-on: p4d-gpu-runners
    steps:
      - name: Check GPUs
        run: nvidia-smi

      - name: Check Docker
        run: |
          docker info
          docker run --rm --gpus all nvidia/cuda:12.0-base nvidia-smi
