name: Test - P4D 4 GPUs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-cdk-changes.yaml"

jobs:
  test-gpu-standard:
    runs-on: gpu-standard-runners
    steps:
      - name: Check GPUs
        run: nvidia-smi

      - name: Check Docker
        run: |
          docker info
          echo "Pod NVIDIA_VISIBLE_DEVICES: $NVIDIA_VISIBLE_DEVICES"
          docker pull nvidia/cuda:12.0.0-base-ubuntu22.04
          docker run --rm --gpus "\"device=${NVIDIA_VISIBLE_DEVICES}\"" nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi

  test-p4d:
    runs-on: p4d-gpu-runners
    steps:
      - name: Check GPUs
        run: nvidia-smi

      - name: Check Docker
        run: |
          docker info
          echo "Pod NVIDIA_VISIBLE_DEVICES: $NVIDIA_VISIBLE_DEVICES"
          docker pull nvidia/cuda:12.0.0-base-ubuntu22.04
          docker run --rm --gpus "\"device=${NVIDIA_VISIBLE_DEVICES}\"" nvidia/cuda:12.0.0-base-ubuntu22.04 nvidia-smi
